<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';" />
  <title>Agent Deck</title>
  <link rel="stylesheet" href="../node_modules/xterm/css/xterm.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <aside id="repos">
      <div class="repos-head">
        <span class="repos-title">Repositories</span>
        <div class="repos-actions">
          <button type="button" id="repo-refresh" title="Refresh git status">&#x21bb;</button>
          <button type="button" id="repo-add" title="Add repository (folder)">+</button>
        </div>
      </div>
      <div id="repo-msg" class="repo-msg" hidden></div>
      <div id="repo-list" class="repo-list"></div>
      <div id="repo-empty" class="repo-empty">
        <p>リポジトリ未登録</p>
        <p class="repo-empty-sub">＋ でローカルフォルダを追加</p>
      </div>
    </aside>

    <aside id="sidebar">
      <div class="brand">
        <span class="brand-mark">&#x259A;</span>
        <div class="brand-text">
          <h1>AGENT&middot;DECK</h1>
          <p>parallel agent terminals</p>
        </div>
      </div>

      <form id="launch-form" autocomplete="off">
        <label class="field">
          <span class="field-label">Agent</span>
          <select id="preset"></select>
        </label>

        <label class="field">
          <span class="field-label">Startup command</span>
          <input id="command" type="text" spellcheck="false" placeholder="claude" />
          <span class="field-hint">セッション起動時に自動実行されます</span>
        </label>

        <label class="field">
          <span class="field-label">Name <em>(optional)</em></span>
          <input id="name" type="text" spellcheck="false" placeholder="auto" />
        </label>

        <label class="field">
          <span class="field-label">Working directory</span>
          <div class="dir-row">
            <input id="cwd" type="text" spellcheck="false" placeholder="~" />
            <button type="button" id="browse" title="Browse">&hellip;</button>
          </div>
          <span class="field-hint" id="repo-hint"></span>
        </label>

        <div class="field wt-field">
          <label class="toggle">
            <input id="wt-enable" type="checkbox" />
            <span>Isolate in git worktree</span>
          </label>
          <input id="wt-branch" type="text" spellcheck="false" placeholder="agentdeck/branch-name" disabled />
          <span class="field-hint">新規ブランチ＋作業ツリーで隔離起動（競合防止）</span>
        </div>

        <button type="submit" id="launch">&#9654; Launch agent</button>
        <div class="kbd-hint">&#8984;1&ndash;9 ペイン &middot; &#8984;[ &#8984;] 移動 &middot; &#8984;&crarr; 起動 &middot; &#8984;W 終了</div>
      </form>

      <div class="quick">
        <span class="quick-label">Quick launch</span>
        <div class="quick-chips" id="quick-chips"></div>
      </div>

      <div class="legend">
        <span><i class="dot live"></i>live</span>
        <span><i class="dot waiting"></i>attention</span>
        <span><i class="dot"></i>exited</span>
      </div>

      <div class="sidebar-foot">
        <div id="sys-info">&mdash;</div>
        <div id="count">0 sessions</div>
      </div>
    </aside>

    <main id="stage">
      <div id="stage-toolbar" class="stage-toolbar">
        <div id="stage-filter" class="stage-filter" hidden>
          <span id="stage-filter-label"></span>
          <button type="button" id="stage-all" class="sf-all">すべて表示</button>
        </div>
        <div id="layout-switch" class="layout-switch" title="グリッドの列数">
          <button type="button" class="ls-btn active" data-cols="auto">auto</button>
          <button type="button" class="ls-btn" data-cols="1">1</button>
          <button type="button" class="ls-btn" data-cols="2">2</button>
          <button type="button" class="ls-btn" data-cols="3">3</button>
        </div>
      </div>
      <div id="empty" class="empty">
        <div class="empty-inner">
          <span class="empty-mark">&#x259A;&#x259A;&#x259A;</span>
          <h2>No agents running</h2>
          <p>左のパネルからエージェントを起動すると、ここにターミナルが並びます。<br />
             複数立ち上げれば並列で監視できます。</p>
          <button type="button" id="restore-deck" class="restore-deck" hidden></button>
        </div>
      </div>
      <div id="grid"></div>
    </main>
  </div>

  <div id="diff-overlay" class="diff-overlay" hidden>
    <div class="diff-backdrop" id="diff-backdrop"></div>
    <div class="diff-panel">
      <div class="diff-head">
        <div class="diff-title">
          <span id="diff-name">Diff</span>
          <span id="diff-branch" class="pane-badge"></span>
        </div>
        <div class="diff-actions">
          <button id="diff-merge" class="ghost-btn" hidden>merge ↩ base</button>
          <button id="diff-refresh" class="ghost-btn">refresh</button>
          <button id="diff-close" class="ghost-btn">close</button>
        </div>
      </div>
      <div id="diff-meta" class="diff-meta"></div>
      <pre id="diff-body" class="diff-body"></pre>
    </div>
  </div>

  <div id="update-toast" class="update-toast" hidden>
    <span class="ut-mark">↑</span>
    <span id="update-toast-text"></span>
    <button type="button" id="update-download" class="ut-btn">ダウンロード</button>
    <button type="button" id="update-dismiss" class="ut-dismiss" title="閉じる">×</button>
  </div>

  <script src="../node_modules/xterm/lib/xterm.js"></script>
  <script src="../node_modules/xterm-addon-fit/lib/xterm-addon-fit.js"></script>
  <script src="../lib/diff.js"></script>
  <script src="../lib/attention.js"></script>
  <script src="../lib/repos.js"></script>
  <script src="../lib/gitstat.js"></script>
  <script src="../lib/layout.js"></script>
  <script src="../lib/workspace.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
