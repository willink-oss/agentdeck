name: Release

# Build per-OS installers on a version tag and attach them to that GitHub Release.
# Native deps (node-pty) can only be built on their target OS, hence the matrix.
#
# Pipeline: prepare (create ONE draft) -> build x3 (attach installers) -> publish
# (flip the draft live atomically). The release stays a draft until every
# installer is attached, so `releases/latest` — read by the in-app updater, the
# Homebrew tap's auto-updater, and the website's link updater — never sees a
# half-uploaded release. The draft is created once up front because draft
# releases have no tag uniqueness: three matrix jobs racing to create one can
# produce duplicates.
#
# Tag conventions:
#   vX.Y.Z        -> stable: published as latest; brew/site auto-follow, winget via PR
#   vX.Y.Z-beta.N -> pre-release: published flagged; ignored by every channel
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  prepare:
    name: create draft release
    runs-on: ubuntu-latest
    steps:
      - name: Create the draft (idempotent for re-runs)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release for $TAG already exists — re-run, leaving it as is"
            exit 0
          fi
          args=(--draft --generate-notes --title "$TAG")
          [[ "$TAG" == *-* ]] && args+=(--prerelease)
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" "${args[@]}"

  build:
    name: build (${{ matrix.os }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest      # signed+notarized .dmg/.zip when MAC_CSC_LINK is set; else unsigned .dmg
            build: 'true'         # mac build command is chosen at runtime (see step below); 'true'
                                  # is a no-op that keeps the templated `else` branch non-empty
                                  # (an empty `else … fi` is a bash syntax error — broke the mac job)
          - os: windows-latest     # NSIS .exe (x64) + latest.yml → in-app auto-update
            build: npm run dist:win
          - os: ubuntu-latest      # AppImage + .deb (x64) + latest-linux.yml → AppImage auto-update
            build: npm run dist:linux
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Build installers
        shell: bash
        env:
          # macOS code signing / notarization — scoped to macos-latest ONLY (least
          # privilege: never expose Apple creds to the win/linux jobs). Behavior:
          #   * MAC_CSC_LINK unset                  -> UNSIGNED mac build (graceful
          #     fallback; in-app auto-update off, users get the browser fallback).
          #   * MAC_CSC_LINK set + all APPLE_* set   -> signed + notarized (auto-update ON).
          #   * MAC_CSC_LINK set + any APPLE_* missing -> build fails fast (guard below),
          #     instead of a cryptic notarization error.
          # Set all 5 secrets together — see docs/macos-code-signing.md.
          CSC_LINK: ${{ matrix.os == 'macos-latest' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          set -euo pipefail
          if [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            if [[ -n "${CSC_LINK}" ]]; then
              if [[ -z "${APPLE_ID}" || -z "${APPLE_APP_SPECIFIC_PASSWORD}" || -z "${APPLE_TEAM_ID}" ]]; then
                echo "ERROR: MAC_CSC_LINK is set but APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID are missing." >&2
                echo "       All 5 mac signing secrets must be set together — see docs/macos-code-signing.md." >&2
                exit 1
              fi
              echo "macOS: signing cert present -> signed + notarized build (in-app auto-update ENABLED)"
              npm run dist
            else
              echo "macOS: MAC_CSC_LINK not set -> UNSIGNED build; in-app auto-update disabled (browser fallback)."
              # CSC_LINK is exported as "" (empty, but SET) when the secret is absent; electron-builder
              # treats a set-but-empty CSC_LINK as a certificate path and aborts ("… not a file").
              # Unset all signing vars so the unsigned build sees them as truly absent.
              unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
              npm run pack:unsigned
              # An unsigned mac app cannot self-install via Squirrel.Mac, so do NOT
              # publish update metadata for it: drop the zip + yml, keep only the .dmg.
              rm -f dist/latest-mac.yml dist/*.zip dist/*.zip.blockmap 2>/dev/null || true
            fi
          else
            ${{ matrix.build }}
          fi
      - name: Attach installers + update metadata to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          # *.zip / *.blockmap / latest*.yml are the electron-updater feed; absent on
          # unsigned mac (cleaned above) — nullglob makes the glob expand to nothing.
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            dist/*.dmg dist/*.exe dist/*.AppImage dist/*.deb \
            dist/*.zip dist/*.blockmap dist/latest*.yml

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Flip the completed draft live
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$TAG" == *-* ]]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          fi

  # Auto-submit the new version to microsoft/winget-pkgs. Skips quietly until the
  # WINGET_TOKEN secret (PAT with public_repo, used for the fork + PR) is set, and
  # requires the initial package (manual PR) to already exist in winget-pkgs.
  winget:
    name: submit to winget
    needs: publish
    if: ${{ !contains(github.ref_name, '-') }} # stable releases only
    runs-on: windows-latest
    steps:
      - name: Submit the version via wingetcreate
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if (-not $env:WINGET_TOKEN) { Write-Host "WINGET_TOKEN not set - skipping winget submission"; exit 0 }
          $ver = $env:TAG.TrimStart('v')
          $url = "https://github.com/willink-oss/agentdeck/releases/download/$($env:TAG)/Agent.Deck.Setup.$ver.exe"
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          .\wingetcreate.exe update iWillink.AgentDeck --urls $url --version $ver --submit --token $env:WINGET_TOKEN
